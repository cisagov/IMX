include:
  - component: $CI_SERVER_FQDN/eos/cde/elm/ci-components/security-public-content@0.3.1
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/gitleaks.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/trivy_fs.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/trivy_sbom.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/sonarqube.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/python_lint.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/python_test.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/jest.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/vitest.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/playwright.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/build_image.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/semantic_release.yml

variables:
  UV_PYTHON: "3.11"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

stages:
  - security
  - lint
  - test
  - build
  - release
  - mirror

sonarqube:
  allow_failure: true

lint:
  allow_failure: true
  extends: .python-lint
  variables:
    SERVICE: imx-py

test-imx-py:
  extends: .python-test
  stage: test
  allow_failure: true
  variables:
    SERVICE: "imx-py"
  script:
    - uv run pytest --cov=. --cov-report=xml:coverage.xml --html=report.html --self-contained-html
  artifacts:
    when: always
    paths:
      - $SERVICE/coverage.xml
      - $SERVICE/report.html

test-imx-server:
  extends: .jest
  stage: test
  allow_failure: true
  variables:
    SERVICE: "imx-server"

test-imx-client:
  extends: .vitest
  stage: test
  allow_failure: true
  variables:
    SERVICE: "imx-client"

build-client:
  extends: .build-image
  variables:
    IMAGE_NAME: "client"
    CONTEXT_DIR: "."
    DOCKERFILE_PATH: "./imx-client/Dockerfile"

build-server:
  extends: .build-image
  variables:
    IMAGE_NAME: "server"
    CONTEXT_DIR: "imx-server"
    DOCKERFILE_PATH: "./imx-server/Dockerfile"

build-py:
  extends: .build-image
  variables:
    IMAGE_NAME: "py"
    CONTEXT_DIR: "imx-py"
    DOCKERFILE_PATH: "./imx-py/Dockerfile"

# One-way GitLab branch synchronization:
#
# GitLab main -> GitLab main-ghe
#
# main-ghe must initially be created from main. It may then include
# private-only files, such as scripts/.
#
# Required protected CI/CD variables:
# - GITLAB_SYNC_USERNAME
# - GITLAB_SYNC_TOKEN
sync-main-to-main-ghe:
  stage: mirror
  image:
    name: quay.apps.va-brm.th.ten/tie/github-auth:1.0.1
    entrypoint: [""]

  variables:
    GIT_DEPTH: "0"

  before_script:
    - git --version

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

  script:
    - set -eu
    - export GIT_TERMINAL_PROMPT=0

    - |
      if [ -z "${GITLAB_SYNC_USERNAME:-}" ] || [ -z "${GITLAB_SYNC_TOKEN:-}" ]; then
        echo "GITLAB_SYNC_USERNAME and GITLAB_SYNC_TOKEN must be configured."
        exit 1
      fi

    - git config user.name "GitLab CI Branch Sync"
    - git config user.email "gitlab-ci-branch-sync@example.invalid"

    # Do not echo the authenticated GitLab remote URL in job logs.
    - set +x
    - GITLAB_PUSH_URL="https://${GITLAB_SYNC_USERNAME}:${GITLAB_SYNC_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

    # Obtain the current private-source branch.
    - git fetch origin "+refs/heads/main-ghe:refs/remotes/origin/main-ghe"

    # Start from main-ghe so its private-only files remain.
    - git checkout -B main-ghe origin/main-ghe

    # Merge the exact main commit that started this pipeline.
    # A merge conflict stops the job and does not update main-ghe.
    - git merge --no-edit "${CI_COMMIT_SHA}"

    # Pushing main-ghe triggers a separate main-ghe pipeline.
    - git push "${GITLAB_PUSH_URL}" "HEAD:refs/heads/main-ghe"

# One-way private GitHub branch synchronization:
#
# GitLab main-ghe -> Private GitHub main
#
# This is deliberately a normal, non-force push.
# Private GitHub main must initially share history with GitLab main-ghe,
# or must be created from GitLab main-ghe during the approved initial setup.
mirror-main-ghe-to-private-github-main:
  stage: mirror
  image:
    name: quay.apps.va-brm.th.ten/tie/github-auth:1.0.1
    entrypoint: [""]

  variables:
    GIT_DEPTH: "0"

  before_script:
    - git --version
    - curl --version
    - jq --version

  rules:
    - if: '$CI_COMMIT_BRANCH == "main-ghe"'
      when: always
    - when: never

  script:
    - set -eu
    - chmod +x scripts/generate-github-app-token.sh
    - set +x
    - GHEC_TOKEN="$(scripts/generate-github-app-token.sh)"
    - AUTH_B64="$(printf 'x-access-token:%s' "$GHEC_TOKEN" | openssl base64 -A)"
    - export GIT_TERMINAL_PROMPT=0
    - PRIVATE_GITHUB_URL="https://${GHEC_GIT_HOST}/${GHEC_ORG}/${GHEC_REPO}.git"

    # Fast-forward-only update:
    # GitLab main-ghe -> Private GitHub main
    #
    # The push fails safely if GitHub main has unrelated history or if someone
    # directly adds commits to GitHub main.
    - |
      git -c "http.https://${GHEC_GIT_HOST}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" \
        push "${PRIVATE_GITHUB_URL}" \
        "HEAD:refs/heads/main"

# One-way private GitHub tag synchronization:
#
# GitLab tag on main-ghe history -> Private GitHub tag with the same name.
#
# This job does not force-update tags. If the tag already exists on GitHub
# and points to a different commit, GitHub rejects the push.
mirror-main-ghe-tags-to-private-github:
  stage: mirror
  image:
    name: quay.apps.va-brm.th.ten/tie/github-auth:1.0.1
    entrypoint: [""]

  variables:
    GIT_DEPTH: "0"

  before_script:
    - git --version
    - curl --version
    - jq --version

  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: never

  script:
    - set -eu

    # Obtain main-ghe history to validate the tag target.
    - git fetch --no-tags origin "+refs/heads/main-ghe:refs/remotes/origin/main-ghe"

    # Only mirror a tag whose target commit is part of main-ghe history.
    - |
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/main-ghe"; then
        echo "Tag ${CI_COMMIT_TAG} is not reachable from main-ghe."
        echo "Skipping private GitHub tag mirror."
        exit 0
      fi

    # Confirm the private GitHub authentication script is present in the
    # tagged commit. This prevents a public-main-only tag from being mirrored.
    - |
      if ! git cat-file -e "${CI_COMMIT_SHA}:scripts/generate-github-app-token.sh" 2>/dev/null; then
        echo "Tag ${CI_COMMIT_TAG} does not contain scripts/generate-github-app-token.sh."
        echo "Skipping private GitHub tag mirror."
        exit 0
      fi

    - chmod +x scripts/generate-github-app-token.sh
    - set +x
    - GHEC_TOKEN="$(scripts/generate-github-app-token.sh)"
    - AUTH_B64="$(printf 'x-access-token:%s' "$GHEC_TOKEN" | openssl base64 -A)"
    - export GIT_TERMINAL_PROMPT=0
    - PRIVATE_GITHUB_URL="https://${GHEC_GIT_HOST}/${GHEC_ORG}/${GHEC_REPO}.git"

    # Creates the tag when absent or confirms it when it already points
    # to the same Git object. It does not move an existing GitHub tag.
    - |
      git -c "http.https://${GHEC_GIT_HOST}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" \
        push "${PRIVATE_GITHUB_URL}" \
        "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"
