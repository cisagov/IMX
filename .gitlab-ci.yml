include:
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/gitleaks.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/trivy_fs.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/trivy_sbom.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/sonarqube.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/python_lint.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/python_test.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/jest.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/playwright.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/build_image.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/semantic_release.yml

variables:
  UV_PYTHON: "3.11"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

stages:
  - security
  - lint
  - test
  - build
  - release

trivy-fs:
  allow_failure: true

sonarqube:
  allow_failure: true

lint:
  allow_failure: true
  extends: .python-lint
  variables:
    SERVICE: imx-py

test-imx-py:
  extends: .python-test
  stage: test
  allow_failure: true
  variables:
    SERVICE: "imx-py"
  script:
    - uv run pytest --cov=. --cov-report=xml:coverage.xml --html=report.html --self-contained-html
  artifacts:
    when: always
    paths:
      # Overwrites the global paths array to capture BOTH items
      - $SERVICE/coverage.xml
      - $SERVICE/report.html

test-imx-server:
  extends: .jest
  stage: test
  allow_failure: true
  variables:
    SERVICE: "imx-server"

test-imx-client:
  extends: .vitest
  stage: test
  allow_failure: true
  variables:
    SERVICE: "imx-client"

build-client:
  extends: .build-image
  variables:
    IMAGE_NAME: "client"
    CONTEXT_DIR: "."
    DOCKERFILE_PATH: "./imx-client/Dockerfile"

build-server:
  extends: .build-image
  variables:
    IMAGE_NAME: "server"
    CONTEXT_DIR: "imx-server"
    DOCKERFILE_PATH: "./imx-server/Dockerfile"

build-py:
  extends: .build-image
  variables:
    IMAGE_NAME: "py"
    CONTEXT_DIR: "imx-py"
    DOCKERFILE_PATH: "./imx-py/Dockerfile"
