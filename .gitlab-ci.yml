include:
  - component: $CI_SERVER_FQDN/eos/cde/elm/ci-components/security-public-content@0.3.1
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/gitleaks.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/trivy_fs.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/trivy_sbom.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/sonarqube.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/python_lint.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/python_test.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/jest.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/vitest.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/playwright.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/build_image.yml
  - project: eos/cde/elm/ops
    ref: main
    file: /ci-templates/semantic_release.yml

variables:
  UV_PYTHON: "3.11"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

stages:
  - security
  - lint
  - test
  - build
  - release
  - mirror


sonarqube:
  allow_failure: true

lint:
  allow_failure: true
  extends: .python-lint
  variables:
    SERVICE: imx-py

test-imx-py:
  extends: .python-test
  stage: test
  allow_failure: true
  variables:
    SERVICE: "imx-py"
  script:
    - uv run pytest --cov=. --cov-report=xml:coverage.xml --html=report.html --self-contained-html
  artifacts:
    when: always
    paths:
      # Overwrites the global paths array to capture BOTH items
      - $SERVICE/coverage.xml
      - $SERVICE/report.html

test-imx-server:
  extends: .jest
  stage: test
  allow_failure: true
  variables:
    SERVICE: "imx-server"

test-imx-client:
  extends: .vitest
  stage: test
  allow_failure: true
  variables:
    SERVICE: "imx-client"

build-client:
  extends: .build-image
  variables:
    IMAGE_NAME: "client"
    CONTEXT_DIR: "."
    DOCKERFILE_PATH: "./imx-client/Dockerfile"

build-server:
  extends: .build-image
  variables:
    IMAGE_NAME: "server"
    CONTEXT_DIR: "imx-server"
    DOCKERFILE_PATH: "./imx-server/Dockerfile"

build-py:
  extends: .build-image
  variables:
    IMAGE_NAME: "py"
    CONTEXT_DIR: "imx-py"
    DOCKERFILE_PATH: "./imx-py/Dockerfile"

# Automatically merge the current GitLab main commit into main-ghe.
#
# This job runs only on GitLab main. Its push to main-ghe starts a separate
# main-ghe pipeline, which then mirrors main-ghe to private GitHub main.
#
# Prerequisite:
# - GITLAB_SYNC_USERNAME: GitLab project-access-token bot username or
#   service-account username.
# - GITLAB_SYNC_TOKEN: protected and masked token with write_repository.
# - The token identity must be permitted to push to protected main-ghe.
sync-main-to-main-ghe:
  stage: mirror
  image:
    name: quay.apps.va-brm.th.ten/tie/github-auth:1.0.1
    entrypoint: [""]

  variables:
    GIT_DEPTH: "0"

  before_script:
    - git --version

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

  script:
    - set -eu
    - export GIT_TERMINAL_PROMPT=0

    - |
      if [ -z "${GITLAB_SYNC_USERNAME:-}" ] || [ -z "${GITLAB_SYNC_TOKEN:-}" ]; then
        echo "GITLAB_SYNC_USERNAME and GITLAB_SYNC_TOKEN must be configured."
        exit 1
      fi

    - git config user.name "GitLab CI Branch Sync"
    - git config user.email "gitlab-ci-branch-sync@example.invalid"

    # Keep command echo disabled while handling the GitLab write token.
    - set +x
    - GITLAB_PUSH_URL="https://${GITLAB_SYNC_USERNAME}:${GITLAB_SYNC_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

    # Obtain the current private-source branch.
    - git fetch origin "+refs/heads/main-ghe:refs/remotes/origin/main-ghe"

    # Start from main-ghe so its private-only scripts/ directory is retained.
    - git checkout -B main-ghe origin/main-ghe

    # Merge the exact main commit that triggered this pipeline.
    # If there is a merge conflict, the job fails and does not push anything.
    - git merge --no-edit "${CI_COMMIT_SHA}"

    # This push triggers a new pipeline on main-ghe.
    - git push "${GITLAB_PUSH_URL}" "HEAD:refs/heads/main-ghe"

# One-way branch synchronization:
#
# GitLab main-ghe -> Private GitHub main
#
# This job runs only from GitLab main-ghe.
mirror-main-ghe-to-private-github-main:
  stage: mirror
  image:
    name: quay.apps.va-brm.th.ten/tie/github-auth:1.0.1
    entrypoint: [""]

  # Full history is appropriate because this job pushes normal Git history.
  variables:
    GIT_DEPTH: "0"

  before_script:
    - git --version
    - curl --version
    - jq --version

  rules:
    - if: '$CI_COMMIT_BRANCH == "main-ghe"'
      when: always
    - when: never

  script:
    - set -eu
    - chmod +x scripts/generate-github-app-token.sh
    - set +x
    - GHEC_TOKEN="$(scripts/generate-github-app-token.sh)"
    - AUTH_B64="$(printf 'x-access-token:%s' "$GHEC_TOKEN" | openssl base64 -A)"
    - export GIT_TERMINAL_PROMPT=0
    - PRIVATE_GITHUB_URL="https://${GHEC_GIT_HOST}/${GHEC_ORG}/${GHEC_REPO}.git"

    # Read only the current SHA of private GitHub main. This does not fetch,
    # merge, or check out private GitHub files or history into GitLab.
    - |
      PRIVATE_MAIN_SHA="$(
        git -c "http.https://${GHEC_GIT_HOST}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" \
          ls-remote "${PRIVATE_GITHUB_URL}" refs/heads/main | awk '{print $1}'
      )"

      if [ -n "${PRIVATE_MAIN_SHA}" ]; then
        # Make private GitHub main match GitLab main-ghe.
        # The lease fails safely if GitHub main changes after ls-remote runs.
        git -c "http.https://${GHEC_GIT_HOST}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" \
          push --no-thin \
          --force-with-lease="refs/heads/main:${PRIVATE_MAIN_SHA}" \
          "${PRIVATE_GITHUB_URL}" \
          "HEAD:refs/heads/main"
      else
        # Create private GitHub main if it does not already exist.
        git -c "http.https://${GHEC_GIT_HOST}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" \
          push --no-thin \
          "${PRIVATE_GITHUB_URL}" \
          "HEAD:refs/heads/main"
      fi

# One-way tag synchronization:
#
# GitLab main-ghe tag -> Private GitHub tag with the same name.
#
# Create private-release tags from main-ghe, not from main.
mirror-main-ghe-tags-to-private-github:
  stage: mirror
  image:
    name: quay.apps.va-brm.th.ten/tie/github-auth:1.0.1
    entrypoint: [""]

  variables:
    GIT_DEPTH: "0"

  before_script:
    - git --version
    - curl --version
    - jq --version

  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: never

  script:
    - set -eu

    # Obtain main-ghe history for tag validation.
    - git fetch --no-tags origin "+refs/heads/main-ghe:refs/remotes/origin/main-ghe"

    # Skip tags whose target commit is not part of main-ghe history.
    - |
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/main-ghe"; then
        echo "Tag ${CI_COMMIT_TAG} is not reachable from main-ghe."
        echo "Skipping private GitHub tag mirror."
        exit 0
      fi

    # The GitHub token-generation script must exist in the tagged commit.
    # This also prevents tags created directly on public main from proceeding.
    - |
      if ! git cat-file -e "${CI_COMMIT_SHA}:scripts/generate-github-app-token.sh" 2>/dev/null; then
        echo "Tag ${CI_COMMIT_TAG} does not contain the private scripts directory."
        echo "Skipping private GitHub tag mirror."
        exit 0
      fi

    - chmod +x scripts/generate-github-app-token.sh
    - set +x
    - GHEC_TOKEN="$(scripts/generate-github-app-token.sh)"
    - AUTH_B64="$(printf 'x-access-token:%s' "$GHEC_TOKEN" | openssl base64 -A)"
    - export GIT_TERMINAL_PROMPT=0
    - PRIVATE_GITHUB_URL="https://${GHEC_GIT_HOST}/${GHEC_ORG}/${GHEC_REPO}.git"

    - |
      git -c "http.https://${GHEC_GIT_HOST}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" \
        push --no-thin \
        "${PRIVATE_GITHUB_URL}" \
        "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"
