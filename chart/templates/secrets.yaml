{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: imx-secrets
type: Opaque
stringData:
  BASIC_PASSWORD: {{ .Values.secrets.basicPassword | quote }}
  ELASTIC_PASSWORD: {{ .Values.secrets.elasticPassword | quote }}
  KIBANA_PASSWORD: {{ .Values.secrets.kibanaPassword | quote }}
  TAXII_PASSWORD: {{ .Values.secrets.taxiiPassword | quote }}
  TAXII_PROXY_PASSWORD: {{ .Values.secrets.taxiiProxyPassword | quote }}
  VIRUS_TOTAL_KEY: {{ .Values.secrets.virusTotalKey | quote }}
{{- end}}
