{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: imx-secrets
type: Opaque
stringData:
  basic-password: {{ .Values.secrets.basicPassword | quote }}
  elastic-password: {{ .Values.secrets.elasticPassword | quote }}
  kibana-password: {{ .Values.secrets.kibanaPassword | quote }}
  taxii-password: {{ .Values.secrets.taxiiPassword | quote }}
  taxii-proxy-password: {{ .Values.secrets.taxiiProxyPassword | quote }}
  virus-total-key: {{ .Values.secrets.virusTotalKey | quote }}
{{- end}}
