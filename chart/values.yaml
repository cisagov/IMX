secrets:
  create: "false"
  basicPassword: ""
  elasticPassword: ""
  kibanaPassword: ""
  opensearchPassword: ""
  taxiiPassword: ""
  taxiiProxyPassword: ""
  virusTotalKey: ""

client:
  app: imx-client
  host: ""
  image: ""
  imagePullPolicy: Always
  name: imx-client
  podSecurityContext: {}
  port: 8080
  replicaCount: 1
  resources: { limits: { memory: 100Mi } }
  securityContext: {}
  tag: v4.8.1

elastic:
  app: elasticsearch
  discoveryType: single-node
  image: docker.io/library/elasticsearch
  imagePullPolicy: Always
  javaOpts: "-Xms750m -Xmx750m"
  name: elasticsearch
  pathRepo: /opt/snapshots
  podSecurityContext: {}
  port: 9200
  replicaCount: 1
  resources: { limits: { memory: 2Gi, ephemeral-storage: 4Gi } }
  securityContext: {}
  tag: 8.18.8
  url: http://elasticsearch:9200/
  user: ""
  xpackSecurityEnabled: "true"

opensearch:
  app: opensearch
  boostrapMemoryLock: "true"
  discoveryType: single-node
  image: docker.io/library/opensearch
  imagePullPolicy: Always
  name: opensearch
  pathRepo: /opt/snapshots
  pluginsSecurityDisabled: "true"
  podSecurityContext: {}
  port: 9200
  reindexAllowList: "elasticsearch:9200"
  replicaCount: 1
  resources: { limits: { memory: 2Gi, ephemeral-storage: 4Gi } }
  securityContext: {}
  tag: 3.7.0
  url: http://opensearch:9200/
  user: ""

kibana:
  app: kibana
  elasticsearchUsername: ""
  host: ""
  image: docker.io/library/kibana
  imagePullPolicy: Always
  name: kibana
  podSecurityContext: {}
  port: 5601
  replicaCount: 1
  resources: { limits: { memory: 2Gi } }
  securityContext: {}
  tag: 8.18.8
  url: http://kibana:5601/

py:
  app: imx-py
  image: ""
  imagePullPolicy: Always
  name: imx-py
  podSecurityContext: {}
  port: 5000
  replicaCount: 1
  resources: { limits: { memory: 500Mi } }
  securityContext: {}
  tag: v4.8.1
  url: http://imx-py:5000/

server:
  a1Enabled: "false"
  app: imx-server
  auth: ""
  cmaUser: ""
  cmaRequired: []
  database: elasticsearch
  env: "local"
  image: ""
  imagePullPolicy: Always
  keycloakCert: ""
  keycloakRealm: ""
  keycloakUrl: ""
  kibanaEnabled: "false"
  logger: elasticsearch
  name: imx-server
  nodeEnv: "local"
  oidcUrl: ""
  oidcUserField: preferred_username
  podSecurityContext: {}
  port: 3000
  proxyUrl: ""
  replicaCount: 1
  resources: { limits: { memory: 500Mi, ephemeral-storage: 2Gi } }
  securityContext: {}
  smtpHost: ""
  smtpSSL: "false"
  smtpFrom: ""
  smtpTo: ""
  startup: "true"
  tag: v4.8.1
  taxiiA1ApiRoot: ""
  taxiiA1ColId: ""
  taxiiA1CtiId: ""
  taxiiA1RawId: ""
  taxiiUrl: ""
  taxiiUser: ""
  url: http://imx-server:3000/
  virusTotalEnabled: "false"

tika:
  app: apache-tika
  image: docker.io/apache/tika
  imagePullPolicy: Always
  name: apache-tika
  podSecurityContext: {}
  port: 9998
  replicaCount: 1
  resources: { limits: { memory: 1000Mi } }
  securityContext: {}
  tag: 3.2.3.0
  url: http://apache-tika:9998/tika

env: local
