<div class="dialog">
    <div class="modal-header">
        <h4 class="modal-title" id="publish-modal-title">Extensions</h4>
        <button type="button" class="btn-close" aria-label="Close" (click)="onX()"></button>
    </div>
    <div class="modal-body">
        <div class="mb-3">
            <span class="imx-field-label" id="extensions_id_title">
                Extension ID
                <button
                    type="button"
                    class="imx-info"
                    aria-label="About Extension ID"
                    container="body"
                    tooltipClass="imx-tooltip imx-tooltip-wide"
                    ngbTooltip="Select the ID of the extension or predefined extension (if available). Each ID may only be used ONCE. Definitions with no Property Extensions are excluded."
                >
                    <fa-icon [icon]="faInfoCircle"></fa-icon>
                </button>
            </span>
            <input
                class="form-control"
                matInput
                placeholder="Extension ID"
                id="extensions_id"
                [(ngModel)]="this.currentExtension.extension_id"
                [matAutocomplete]="extensionsId"
                (ngModelChange)="getTypes()"
                type="text"
                [ngClass]="{ 'is-invalid': errorMessage }"
            />
            <mat-autocomplete #extensionsId="matAutocomplete" class="imx-autocomplete">
                @for (obj of filteredExtensions; track obj) {
                    <mat-option [value]="obj.id">
                        <div class="extension-option">
                            <div class="extension-name">{{ obj.name }}</div>
                            <div class="extension-id">{{ obj.id }}</div>
                        </div>
                    </mat-option>
                }
            </mat-autocomplete>
            @if (errorMessage) {
                <div class="invalid-feedback">{{ this.errorMessage }}</div>
            }
        </div>

        @if (!predefined && this.errorMessage == '') {
            <div>
                <span class="imx-field-label" id="extensions_type_title">
                    Extension Type
                    <button
                        type="button"
                        class="imx-info"
                        aria-label="About Extension Type"
                        container="body"
                        tooltipClass="imx-tooltip"
                        ngbTooltip="Extension types can currently only be configured one at a time."
                    >
                        <fa-icon [icon]="faInfoCircle"></fa-icon>
                    </button>
                </span>
                <select
                    type="text"
                    class="form-control form-select"
                    [(ngModel)]="this.currentExtension.extension_type"
                    name="extension_type"
                    id="extension_type"
                >
                    @for (opt of type_options; track opt) {
                        @if (!opt.startsWith('New')) {
                            <option [value]="opt">
                                {{ opt }}
                            </option>
                        }
                    }
                </select>
            </div>
        }
    </div>
    <div class="modal-footer">
        <button id="extensions_cancel" type="button" class="btn btn-outline-secondary" (click)="onX()">
            <fa-icon [icon]="faBan" class="pe-1"></fa-icon>
            Cancel
        </button>
        <button id="extensions_configure" type="button" class="btn btn-outline-success" (click)="onConfirm()" [disabled]="!isValid()">
            <fa-icon [icon]="faWrench" class="pe-1"></fa-icon>
            Configure
        </button>
    </div>
</div>
