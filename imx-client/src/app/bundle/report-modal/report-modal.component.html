<div class="modal-header d-flex justify-content-center flex-column">
    <span class="card-title"> Report Name </span>
</div>
<div class="modal-body d-flex flex-column justify-content-center">
    <span class="text-center main-text"> Please enter the name for the Report </span>
    <input class="form-control control-form mt-2" placeholder="Name of Report" [(ngModel)]="reportName" />
</div>
<div class="modal-footer d-flex justify-content-center">
    <button class="btn btn-outline" (click)="closeModal()">Cancel</button>
    <button class="btn btn-outline-success" (click)="saveReportName()">Confirm</button>
</div>
