<div class="dialog">
    <div class="modal-header">
        <h4 class="modal-title" id="publish-modal-title">Granular Markings</h4>
        <button type="button" class="btn-close" aria-label="Close" (click)="onX()"></button>
    </div>
    <div class="modal-body">
        @if (this.errorMessage) {
            <div class="warning-message mb-3">{{ this.errorMessage }}</div>
        }

        @if (isAddingGranularMarkings) {
            <div class="mb-3">
                <span class="imx-field-label" id="gmarkings_selectors_title">
                    Selectors
                    <button
                        type="button"
                        class="imx-info"
                        aria-label="About Selectors"
                        container="body"
                        tooltipClass="imx-tooltip"
                        ngbTooltip="ctrl+click to choose multiple selectors. The text field displays current selection(s)."
                    >
                        <fa-icon [icon]="faInfoCircle"></fa-icon>
                    </button>
                </span>
                <input placeholder="Selectors" class="form-control mb-2" [value]="getSelected()" type="text" [disabled]="true" />
                <select
                    type="text"
                    size="3"
                    class="selectpicker form-control form-select"
                    [(ngModel)]="this.newSelector"
                    name="newSelector"
                    id="newSelector"
                    multiple
                    style="height: 125px"
                >
                    @for (item of stixService.granularMarkingSelectors; track item) {
                        <option [value]="item">
                            {{ item }}
                        </option>
                    }
                </select>
            </div>

            <div class="mb-3">
                <span class="imx-field-label" id="gmarkings_lang_title">Language</span>
                <select
                    id="gmarkings_lang"
                    type="text"
                    class="form-control form-select"
                    [ngClass]="{ 'select-placeholder': !this.currentGranularMarking.lang }"
                    [(ngModel)]="this.currentGranularMarking.lang"
                    [disabled]="this.currentGranularMarking.marking_ref != ''"
                >
                    <option value="">Language</option>
                    @for (lang of this.lang_options; track lang) {
                        <option [value]="lang.key">{{ lang.value }}</option>
                    }
                </select>
            </div>

            <div class="mb-3">
                <span class="imx-field-label" id="gmarkings_marking_refs_title">
                    Marking Reference
                    <button
                        type="button"
                        class="imx-info"
                        aria-label="About Marking Reference"
                        container="body"
                        tooltipClass="imx-tooltip"
                        ngbTooltip="Common references in the version dropdown - use the box on the right for custom entries."
                    >
                        <fa-icon [icon]="faInfoCircle"></fa-icon>
                    </button>
                </span>
                <div class="input-group">
                    <select
                        type="text"
                        id="gmarkings_marking_refs_version"
                        class="form-control form-select"
                        style="max-width: 130px"
                        (change)="getTlpOptions($event)"
                        [disabled]="!isTLPOne || this.currentGranularMarking.lang != ''"
                        [(ngModel)]="tlp_version"
                    >
                        <option value=""></option>
                        <option value="v1">TLP v1.0</option>
                        <option value="v2">TLP v2.0</option>
                    </select>
                    <select
                        type="text"
                        [(ngModel)]="this.currentGranularMarking.marking_ref"
                        [ngClass]="{ 'select-placeholder': !this.currentGranularMarking.marking_ref }"
                        [disabled]="this.currentGranularMarking.lang != ''"
                        id="gmarkings_marking_refs"
                        class="form-control form-select"
                    >
                        <option value="">TLP</option>
                        @for (tlp of tlp_options; track tlp) {
                            <option [value]="tlp.value">
                                {{ tlp.key }}
                            </option>
                        }
                    </select>
                </div>
            </div>
        }
    </div>
    <div class="modal-footer">
        <button id="gmarkings_cancel" type="button" class="btn btn-outline-secondary" (click)="onX()">
            <fa-icon [icon]="faBan" class="pe-1"></fa-icon>
            Cancel
        </button>
        <button
            id="gmarkings_add_button"
            type="button"
            class="btn btn-outline-success"
            (click)="onConfirm()"
            [disabled]="
                (this.currentGranularMarking.lang == '' && this.currentGranularMarking.marking_ref == '') ||
                this.newSelector.length == 0 ||
                this.newSelector[0] == ''
            "
        >
            <fa-icon [icon]="faPlus" class="pe-1"></fa-icon>
            Add
        </button>
    </div>
</div>
