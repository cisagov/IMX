title = "Gitleaks Configuration"

# This section controls what should be allowed/skipped.
[allowlist]
# Add directory or file patterns here. Examples:
# paths = ["node_modules/.*", "dist/.*"]
paths = [
    # CLIENT
    "imx-client/src/app/models/*",
    "imx-client/\\.angular/.*",
    "imx-client/node_modules/.*",
    "imx-client/src/app/stix-viewer/stix2viz/visjs/vis-network.ts",
    # SERVER
    "imx-server/node_modules/.*",
    # README
    "README.md"
]

###############################################
# Default ruleset                             #
# (This uses the built‑in rules that ship     #
# with Gitleaks. You don't need to define     #
# anything custom unless you want to.)        #
###############################################
[extend]
useDefault = true
