title = "Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
paths = [
    '''^imx-client/\.angular/''',
    '''(?:^|/)node_modules/''',
]

# Public vocabulary and vendored method names are not API keys.
# Other rules, including endpoint rules, still scan these files.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
condition = "AND"
paths = [
    '''^imx-client/src/app/models/(?:mime|name_enc|path|protocols|artifact|malware)\.ts$''',
]
regexTarget = "line"
regexes = ['''^\s*\{\s*key:\s*['"][^'"]+['"],\s*value:\s*['"][^'"]+['"]\s*\},?\s*$''']

[[rules.allowlists]]
condition = "AND"
paths = ['''^imx-client/src/app/stix-viewer/stix2viz/visjs/vis-network\.ts$''']
regexTarget = "secret"
regexes = ['''^_getDistanceToBezierEdge2$''']
