[tools]
prek = "latest"
python = "latest"
uv = "latest"
node = "lts"
npm = "latest"
hadolint = "latest"
"npm:@angular/cli" = "latest"

[settings]
python.uv_venv_auto = "create|source"

[tasks.install]
description = "Setup hooks and install all deps"
run = """
prek install
uv sync --project imx-py
cd imx-client && npm install
cd ../imx-server && npm install
cd ../ && npm i && npx playwright install
"""

[tasks.init]
description = "Initial steps for build locally"
run = """
cp .env.example .env
cp env.json.example env.json
cp env.json.example ./imx-client/src/assets/env.json
docker compose up -d --build
"""

[tasks.compose]
description = "Rebuild IMX"
run = """
docker compose up -d --build
"""

[tasks.playwright]
description = "Runs playwright tests"
depends = ["init"]
run = """
npx playwright test tests/
"""

[tasks.jest]
description = "Runs jest tests"
depends = ["install"]
run = """
cd imx-server
npm run test -- --ci --coverage --coverageReporters=cobertura --reporters=default --reporters=jest-junit --outputFile=junit.xml
"""

[tasks.trivy-client]
description = "Scan client image"
run = """
cd imx-client
docker build -t tie/imx/client:test .
trivy image tie/imx/client:test
"""

[tasks.trivy-server]
description = "Scan server image"
run = """
cd imx-server
docker build -t tie/imx/server:test .
trivy image tie/imx/server:test
"""

[tasks.trivy-py]
description = "Scan py image"
run = """
cd imx-py
docker build -t tie/imx/py:test .
trivy image tie/imx/py:test
"""

[tasks.audit-client]
description = "Scan client npm packages"
run = """
cd imx-client
npm audit
"""

[tasks.audit-server]
description = "Scan server npm packages"
run = """
cd imx-server
npm audit
"""
